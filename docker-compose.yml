# Production: app + automatic HTTPS (Caddy) + daily backups.
# 1. Copy .env.example to .env and set DOMAIN.  2. docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data

  # Makes a copy of the database once a day (first one when it starts), keeps the last 30.
  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c", "while true; do node dist/cli.mjs backup; sleep 86400; done"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
